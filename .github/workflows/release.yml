name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git for Paperweight
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "no-reply@github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build release Paperclip JAR
        run: ./gradlew :apis-server:createPaperclipJar -Prelease=true --stacktrace

      - name: Stage release Paperclip JAR and SHA-256 checksums
        run: |
          mkdir -p release-assets
          cp apis-server/build/libs/apis-paperclip-*.jar release-assets/
          cd release-assets
          sha256sum apis-paperclip-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/apis-paperclip-*.jar
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
