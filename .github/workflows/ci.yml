name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Configure Git for Paperweight
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "no-reply@github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Run quickCheck
        run: ./gradlew quickCheck --stacktrace

      - name: Build test Paperclip JAR
        run: ./gradlew :apis-server:createPaperclipJar -Prelease=true --stacktrace

      - name: Upload test and Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.run_number }}
          path: |
            apis-server/build/test-results/test/TEST-*.xml
            apis-server/build/reports/checkstyle/*.xml
          if-no-files-found: ignore
